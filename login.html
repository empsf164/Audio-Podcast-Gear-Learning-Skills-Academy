<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Login — WAVECRAFT</title>
  <meta name="description"
    content="Access your WAVECRAFT gear orders, registered warranties, and Academy video masterclasses.">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body class="bg-tech-pattern d-flex flex-column min-vh-100 align-items-center justify-content-center py-4">

  <!-- LOGIN MAIN -->
  <main class="w-100 py-3">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
          <div class="p-4 p-md-5 rounded-4 border border-secondary border-opacity-25"
            style="background: var(--bg-surface-1); box-shadow: var(--shadow-lg);">
            
            <!-- BRANDNAME TOP CENTER INSIDE BOX -->
            <div class="text-center mb-4">
              <a href="index.html" class="wave-brand mx-auto d-inline-flex align-items-center justify-content-center mb-3 text-decoration-none">
                <div class="brand-wave-icon me-2"><i class="bi bi-soundwave"></i></div>
                <span class="brand-text fs-4 fw-bold">WAVECRAFT</span>
              </a>
              <h1 class="h4 fw-bold mb-1">Welcome Back</h1>
              <p class="text-secondary small mb-0">Sign in to manage gear orders, academy lessons, and warranty registration.</p>
            </div>

            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="loginEmail" class="wave-form-label">Email Address</label>
                <input type="email" class="wave-input" id="loginEmail" placeholder="e.g. creator@wavecraft.com" required>
                <div class="form-feedback-error">Please provide a valid email address.</div>
              </div>

              <div class="mb-3">
                <label for="loginPassword" class="wave-form-label">Password</label>
                <input type="password" class="wave-input" id="loginPassword" placeholder="••••••••" required>
                <div class="form-feedback-error">Please provide your password.</div>
              </div>

              <!-- REMEMBER ME AND FORGOT PASSWORD IN THE SAME LINE -->
              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check mb-0">
                  <input class="form-check-input" type="checkbox" id="loginRemember">
                  <label class="form-check-label small text-secondary" for="loginRemember">
                    Remember me
                  </label>
                </div>
                <a href="forgot-password.html" class="text-info small fw-medium">Forgot Password?</a>
              </div>

              <button type="submit" class="btn-wave btn-wave-primary btn-wave-lg w-100 mb-3">
                Sign In to Account
              </button>
            </form>

            <!-- SOCIAL LOGIN BUTTONS AT BOTTOM -->
            <div class="my-4 text-center position-relative">
              <div class="border-top border-secondary border-opacity-25 w-100 position-absolute top-50 start-0"></div>
              <span class="px-3 text-uppercase font-tech small position-relative" style="background: var(--bg-surface-1); z-index: 1; font-size: 0.75rem; letter-spacing: 0.05em; color: var(--text-muted);">Or Continue With</span>
            </div>

            <div class="d-flex gap-3 mb-4">
              <button type="button" class="btn-wave btn-wave-secondary w-50 d-flex align-items-center justify-content-center gap-2 py-2">
                <i class="bi bi-google text-danger fs-5"></i> <span class="fw-semibold">Google</span>
              </button>
              <button type="button" class="btn-wave btn-wave-secondary w-50 d-flex align-items-center justify-content-center gap-2 py-2">
                <i class="bi bi-apple text-light fs-5"></i> <span class="fw-semibold">Apple</span>
              </button>
            </div>

            <div class="text-center pt-3 border-top border-secondary border-opacity-10">
              <span class="text-muted small">Don't have a WAVECRAFT account yet?</span>
              <a href="signup.html" class="text-info small fw-bold ms-1">Create Account</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.getElementById('loginForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail');
      const pass = document.getElementById('loginPassword');
      let ok = true;
      if (!email.value.trim()) { email.classList.add('is-invalid'); ok = false; } else email.classList.remove('is-invalid');
      if (!pass.value.trim()) { pass.classList.add('is-invalid'); ok = false; } else pass.classList.remove('is-invalid');
      if (ok) {
        window.WavecraftToast && window.WavecraftToast.show('Login successful! Redirecting to shop showroom...', 'success');
        setTimeout(() => window.location.href = 'shop.html', 1200);
      }
    });
  </script>
</body>

</html>
