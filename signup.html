<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create WAVECRAFT Account — Join Audio & Academy</title>
  <meta name="description" content="Register your WAVECRAFT creator account to enroll in academy courses and manage your audio equipment.">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body class="bg-tech-pattern d-flex flex-column min-vh-100 align-items-center justify-content-center py-4">

  <!-- SIGNUP MAIN -->
  <main class="w-100 py-3">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
          <div class="p-4 p-md-5 rounded-4 border border-secondary border-opacity-25"
            style="background: var(--bg-surface-1); box-shadow: var(--shadow-lg);">

            <!-- BRANDNAME TOP CENTER INSIDE BOX -->
            <div class="text-center mb-4">
              <a href="index.html" class="wave-brand mx-auto d-inline-flex align-items-center justify-content-center mb-3 text-decoration-none">
                <div class="brand-wave-icon me-2"><i class="bi bi-soundwave"></i></div>
                <span class="brand-text fs-4 fw-bold">WAVECRAFT</span>
              </a>
              <h1 class="h4 fw-bold mb-1">Create Your Account</h1>
              <p class="text-secondary small mb-0">Join the WAVECRAFT community of podcasters, audio engineers, and sound creators.</p>
            </div>

            <form id="signupForm" novalidate>
              <div class="mb-3">
                <label for="signupName" class="wave-form-label">Full Name</label>
                <input type="text" class="wave-input" id="signupName" placeholder="e.g. Jordan Miller" required>
                <div class="form-feedback-error">Please enter your full name.</div>
              </div>

              <div class="mb-3">
                <label for="signupEmail" class="wave-form-label">Email Address</label>
                <input type="email" class="wave-input" id="signupEmail" placeholder="e.g. jordan@creatorpod.com" required>
                <div class="form-feedback-error">Please enter a valid email.</div>
              </div>

              <div class="mb-3">
                <label for="signupPassword" class="wave-form-label">Password</label>
                <input type="password" class="wave-input" id="signupPassword" placeholder="Minimum 8 characters" required>
                <div class="form-feedback-error">Password must be at least 8 characters.</div>
              </div>

              <div class="mb-3">
                <label for="signupPasswordConfirm" class="wave-form-label">Confirm Password</label>
                <input type="password" class="wave-input" id="signupPasswordConfirm" placeholder="Repeat password" required>
                <div class="form-feedback-error">Passwords must match.</div>
              </div>

              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="signupNewsletter" checked>
                <label class="form-check-label small text-secondary" for="signupNewsletter">
                  I want to receive audio learning updates, free studio acoustic guides, and new gear alerts.
                </label>
              </div>

              <button type="submit" class="btn-wave btn-wave-primary btn-wave-lg w-100 mb-3">
                Create Account
              </button>
            </form>

            <!-- SOCIAL LOGIN BUTTONS AT BOTTOM -->
            <div class="my-4 text-center position-relative">
              <div class="border-top border-secondary border-opacity-25 w-100 position-absolute top-50 start-0"></div>
              <span class="px-3 text-uppercase font-tech small position-relative" style="background: var(--bg-surface-1); z-index: 1; font-size: 0.75rem; letter-spacing: 0.05em; color: var(--text-muted);">Or Sign Up With</span>
            </div>

            <div class="d-flex gap-3 mb-4">
              <button type="button" class="btn-wave btn-wave-secondary w-50 d-flex align-items-center justify-content-center gap-2 py-2">
                <i class="bi bi-google text-danger fs-5"></i> <span class="fw-semibold">Google</span>
              </button>
              <button type="button" class="btn-wave btn-wave-secondary w-50 d-flex align-items-center justify-content-center gap-2 py-2">
                <i class="bi bi-apple text-light fs-5"></i> <span class="fw-semibold">Apple</span>
              </button>
            </div>

            <div class="text-center pt-3 border-top border-secondary border-opacity-10">
              <span class="text-muted small">Already registered?</span>
              <a href="login.html" class="text-info small fw-bold ms-1">Sign In</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.getElementById('signupForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('signupName');
      const email = document.getElementById('signupEmail');
      const pass = document.getElementById('signupPassword');
      const confirm = document.getElementById('signupPasswordConfirm');

      let ok = true;
      if (!name.value.trim()) { name.classList.add('is-invalid'); ok = false; } else name.classList.remove('is-invalid');
      if (!email.value.trim() || !email.value.includes('@')) { email.classList.add('is-invalid'); ok = false; } else email.classList.remove('is-invalid');
      if (!pass.value || pass.value.length < 8) { pass.classList.add('is-invalid'); ok = false; } else pass.classList.remove('is-invalid');
      if (pass.value !== confirm.value) { confirm.classList.add('is-invalid'); ok = false; } else confirm.classList.remove('is-invalid');

      if (ok) {
        window.WavecraftToast && window.WavecraftToast.show('Account created successfully! Welcome to WAVECRAFT.', 'success');
        setTimeout(() => window.location.href = 'academy.html', 1200);
      }
    });
  </script>
</body>

</html>
